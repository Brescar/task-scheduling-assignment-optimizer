services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: beijer_ref_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:80"
    volumes:
      - ./backend:/app
      - ./data:/app/data:ro
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-4c9a895b6d92ec1734bc1e2c9ef1d7a8}
      SERVER_NAME: ":80"
    networks:
      - beijer-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: beijer_ref_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./data:/app/data:ro
    environment:
      NUXT_BACKEND_URL: ${NUXT_BACKEND_URL:-http://backend:80}
      NUXT_USE_MOCK: ${NUXT_USE_MOCK:-false}
    depends_on:
      - backend
    networks:
      - beijer-network

volumes:
  frontend_node_modules:

networks:
  beijer-network:
    driver: bridge

